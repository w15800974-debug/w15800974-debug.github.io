<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="علی حاجیان — توسعه‌دهنده هوش مصنوعی، تکنولوژیست خلاق و کارآفرین دیجیتال | Ali Hajjian — AI Developer & Creative Technologist" />
    <title>علی حاجیان — توسعه‌دهنده هوش مصنوعی · تکنولوژیست خلاق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;700&family=Vazirmatn:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['var(--font-display)'],
              serif: ['var(--font-serif)'],
              mono: ['var(--font-mono)'],
            },
            colors: {
              ink: '#05060a',
            }
          }
        }
      };
    </script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <style>
:root {
--font-display: "Vazirmatn", "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
--font-serif: "Instrument Serif", "Vazirmatn", ui-serif, Georgia, serif;
--font-mono: "JetBrains Mono", "Vazirmatn", ui-monospace, SFMono-Regular, Menlo, monospace;
--color-ink: #05060a;
}
.font-display { font-family: var(--font-display); }
.font-serif { font-family: var(--font-serif); }
.font-mono { font-family: var(--font-mono); }
:root {
--c1: #7c5cff;
--c2: #29e5ff;
--c3: #ff4d8d;
--acid: #d6ff3f;
--ink: #05060a;
}
html[lang="en"] {
--font-display: "Bricolage Grotesque", "Vazirmatn", ui-sans-serif, system-ui, sans-serif;
}
html[lang="fa"] {
--font-display: "Vazirmatn", "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
}
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-stopped { overflow: hidden; }
html { background: var(--ink); }
body {
margin: 0;
background: var(--ink);
color: #eef0f6;
font-family: var(--font-display);
font-variation-settings: "wdth" 100;
overflow-x: clip;
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility;
}
::selection { background: var(--acid); color: #000; }
html.has-cursor, html.has-cursor * { cursor: none !important; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; }
.mono {
font-family: var(--font-mono);
font-size: 11px;
letter-spacing: 0.14em;
text-transform: uppercase;
}
html[lang="fa"] .mono {
letter-spacing: 0.02em;
font-size: 12px;
}
.serif { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
html[lang="fa"] .serif { font-family: "Vazirmatn", sans-serif; font-style: normal; font-weight: 700; letter-spacing: 0; }
.glass {
background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
border: 1px solid rgba(255,255,255,.09);
backdrop-filter: blur(18px) saturate(140%);
-webkit-backdrop-filter: blur(18px) saturate(140%);
}
.hairline { border-color: rgba(255,255,255,.09); }
.text-grad {
background: linear-gradient(100deg, var(--c2), var(--c1) 45%, var(--c3));
-webkit-background-clip: text;
background-clip: text;
color: transparent;
background-size: 200% 100%;
animation: gradshift 8s ease-in-out infinite alternate;
}
.outline-text {
color: transparent;
-webkit-text-stroke: 1px rgba(255,255,255,.4);
}
@keyframes gradshift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--acid) 60%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes rise { from { transform: translateY(115%) rotate(6deg); } to { transform: translateY(0) rotate(0); } }
@keyframes fade-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes grain-shift {
0%,100% { transform: translate(0,0); } 10% { transform: translate(-3%,-4%); } 30% { transform: translate(4%,-2%); }
50% { transform: translate(-2%,5%); } 70% { transform: translate(5%,3%); } 90% { transform: translate(-4%,2%); }
}
@keyframes cue { from { transform: translateY(-100%); } to { transform: translateY(200%); } }
@keyframes bar { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
@keyframes glitch-a { 0%,92%,100% { transform: translate(0); clip-path: inset(0 0 0 0); } 93% { transform: translate(-3px, 1px); clip-path: inset(10% 0 55% 0); } 96% { transform: translate(3px,-1px); clip-path: inset(60% 0 8% 0); } }
@keyframes glitch-b { 0%,92%,100% { transform: translate(0); clip-path: inset(0 0 0 0); } 94% { transform: translate(3px, -1px); clip-path: inset(40% 0 30% 0); } 97% { transform: translate(-3px,1px); clip-path: inset(5% 0 70% 0); } }
@keyframes hue { to { filter: hue-rotate(360deg); } }
.pulse-dot { animation: pulse-dot 2s infinite; }
.caret::after { content: "▍"; margin-inline-start: 2px; animation: blink 1s steps(1) infinite; color: var(--acid); }
.grain {
position: fixed; inset: -50%; width: 200%; height: 200%;
pointer-events: none; z-index: 90; opacity: .07; mix-blend-mode: overlay;
background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
animation: grain-shift 1.2s steps(6) infinite;
}
.reveal { opacity: 0; transform: translateY(46px); filter: blur(10px); transition: opacity 1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1s ease; transition-delay: var(--d, 0ms); }
.reveal.in { opacity: 1; transform: none; filter: none; }
.split-mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .16em; margin-bottom: -.16em; }
.split-inner { display: inline-block; transform: translateY(115%) rotate(5deg); transform-origin: left bottom; transition: transform 1.1s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.in .split-inner { transform: none; }
.btn {
position: relative; display: inline-flex; align-items: center; gap: .7rem;
padding: 1rem 1.6rem; border-radius: 999px; overflow: hidden; isolation: isolate;
font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
border: 1px solid rgba(255,255,255,.18); color: #fff; background: rgba(255,255,255,.03);
transition: color .4s, border-color .4s;
}
html[lang="fa"] .btn {
letter-spacing: 0.01em;
font-size: 13px;
font-weight: 500;
}
.btn::before {
content: ""; position: absolute; inset: 0; z-index: -1; background: var(--acid);
transform: translateY(101%); border-radius: 50% 50% 0 0 / 100% 100% 0 0; transition: transform .55s cubic-bezier(.2,.8,.2,1), border-radius .55s;
}
.btn:hover { color: #000; border-color: var(--acid); }
.btn:hover::before { transform: translateY(0); border-radius: 0; }
.btn-solid { background: var(--acid); color: #000; border-color: var(--acid); }
.btn-solid::before { background: #fff; }
.btn-solid:hover { border-color: #fff; }
.chip {
font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em;
padding: .45rem .8rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
color: rgba(255,255,255,.7); background: rgba(255,255,255,.03); transition: all .3s;
}
html[lang="fa"] .chip {
letter-spacing: 0;
font-size: 12px;
}
.chip:hover, .chip[data-on="true"] { border-color: var(--acid); color: var(--acid); background: color-mix(in srgb, var(--acid) 8%, transparent); }
.vignette { background: radial-gradient(ellipse at center, transparent 40%, rgba(5,6,10,.75) 100%); }
body.overdrive #root { animation: hue 1.4s linear infinite; }
.glitch { position: relative; display: inline-block; }
.glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; }
.glitch::before { color: var(--c2); animation: glitch-a 3.5s infinite; mix-blend-mode: screen; }
.glitch::after { color: var(--c3); animation: glitch-b 3.5s infinite; mix-blend-mode: screen; }
input, textarea { font-family: inherit; }
input::placeholder, textarea::placeholder { color: rgba(255,255,255,.28); }
@media (prefers-reduced-motion: reduce) {
.grain { animation: none; }
.text-grad { animation: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="./bundle-1.js"></script>
<script src="./bundle-2.js"></script>
<script src="./bundle-3.js"></script>
</body>
</html>
